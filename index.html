    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>var adaraMode;try{adaraMode=localStorage.getItem('adara-color-mode')}catch{}if(adaraMode!=='light'&&adaraMode!=='dark')adaraMode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.colorMode=adaraMode;document.documentElement.style.colorScheme=adaraMode;</script>
    <meta name="theme-color" content="#0758df" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/adara-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/adara-mark-32.png" />
    <link rel="shortcut icon" href="/icons/adara-mark.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/adara-mark-180.png" />
    <meta name="description" content="Adara Web — página profesional, agenda y reservas para profesionales." />
    <title>Adara Web — Tu negocio, en un solo lugar</title>
